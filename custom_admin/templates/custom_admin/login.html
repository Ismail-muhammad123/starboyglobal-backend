<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Starboy Global</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/portal/css/admin.css">
  <script src="/static/portal/js/theme.js"></script>
</head>
<body class="bg-[#0A1628] text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md">
    <!-- Brand Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-3">
        <img src="/static/img/logo.png" alt="Starboy Global" class="w-16 h-16 object-contain">
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">Starboy Global</h1>
      <p class="text-xs text-blue-400 font-medium tracking-wider uppercase mt-1">Admin Dashboard Login</p>
    </div>

    <!-- Login Card -->
    <div class="portal-card p-8 shadow-2xl backdrop-blur-xl border border-slate-700/60 bg-slate-900/80">
      
      {% if error %}
        <div class="mb-6 p-3 rounded-lg bg-red-950/80 border border-red-800 text-red-200 text-xs flex items-center gap-2">
          <span>⚠️</span>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="POST" action="{% url 'portal:login' %}" class="space-y-5">
        {% csrf_token %}

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Phone Number</label>
          <input type="text" name="phone_number" required placeholder="e.g. 08012345678"
                 class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password / PIN</label>
          <input type="password" name="password" required placeholder="••••••••"
                 class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all">
        </div>

        <button type="submit" class="w-full py-3.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/30 transition-all transform active:scale-[0.99]">
          Sign In to Portal →
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-slate-500">
        Strictly restricted to authorized staff & admin personnel only.
      </div>
    </div>
  </div>

</body>
</html>
