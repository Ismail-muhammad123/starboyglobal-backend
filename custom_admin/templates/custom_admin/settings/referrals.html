{% extends 'custom_admin/base.html' %}
{% block title %}Referral Configuration - Starboy Global Admin Dashboard{% endblock %}
{% block page_title %}Referral Program Configuration{% endblock %}
{% block content %}
<div class="space-y-6">

  <div class="portal-card p-6 max-w-xl">
    <form method="POST" action="{% url 'portal:referral_config' %}" data-ajax="true" data-reload="true" class="space-y-4 text-xs">
      {% csrf_token %}

      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-bold text-white text-base">Referral Commission Rules</h3>
        <label class="flex items-center gap-2 cursor-pointer font-semibold text-slate-300">
          <input type="checkbox" name="is_active" {% if config.is_active %}checked{% endif %}>
          <span>Program Active</span>
        </label>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block font-semibold text-slate-400 mb-1">Commission Type</label>
          <select name="commission_type" class="portal-input w-full">
            <option value="flat" {% if config.commission_type == 'flat' %}selected{% endif %}>Flat Amount (₦)</option>
            <option value="percentage" {% if config.commission_type == 'percentage' %}selected{% endif %}>Percentage (%)</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-400 mb-1">Value</label>
          <input type="number" step="0.01" name="commission_value" value="{{ config.commission_value }}" class="portal-input w-full font-mono text-sm">
        </div>
      </div>

      <div>
        <label class="block font-semibold text-slate-400 mb-1">Reward Trigger</label>
        <select name="commission_mode" class="portal-input w-full">
          <option value="signup" {% if config.commission_mode == 'signup' %}selected{% endif %}>On User Signup</option>
          <option value="credit" {% if config.commission_mode == 'credit' %}selected{% endif %}>On First Wallet Credit</option>
          <option value="transaction" {% if config.commission_mode == 'transaction' %}selected{% endif %}>On Every Transaction</option>
        </select>
      </div>

      <div class="pt-2 flex justify-end">
        <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-xs shadow">
          Save Referral Rules
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
